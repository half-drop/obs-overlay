name: Build and Release (26.3)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version after a successful build
        type: boolean
        default: false
  push:
    branches:
      - '26.3'
    tags:
      - '26.3/*'
  pull_request:
    branches:
      - '26.3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build and Release"
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/26.3' || startsWith(github.ref, 'refs/tags/26.3/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read mod properties
        run: |
          sed -nE 's/^(mod_version|minecraft_version|supported_version|archives_name)[[:space:]]*=[[:space:]]*(.*)$/\1=\2/p' gradle.properties >> "$GITHUB_ENV"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "$minecraft_version/$mod_version"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup and Build with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Build with Gradle
        run: |
          for attempt in 1 2 3; do
            ./gradlew :fabric:build :neoforge:build --stacktrace --no-daemon && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Build failed; retrying in 15 seconds (attempt $((attempt + 1))/3)..."
            sleep 15
          done

      - name: Prepare JARs
        run: |
          mkdir -p build/release
          for loader in fabric neoforge; do
            jar="$loader/build/libs/$archives_name-$loader-$mod_version.jar"
            test -s "$jar"
            cp "$jar" "build/release/$archives_name-$loader-$mod_version-$minecraft_version.jar"
          done
          cd build/release
          sha256sum *.jar > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-overlay-${{ env.minecraft_version }}-${{ env.mod_version }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/release/*.jar
            build/release/SHA256SUMS

      - name: Create release
        if: >-
          startsWith(github.ref, 'refs/tags/26.3/') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/26.3' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.minecraft_version }}/${{ env.mod_version }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.mod_version }} - Minecraft ${{ env.supported_version }}
          prerelease: ${{ contains(env.mod_version, '-') }}
          make_latest: ${{ contains(env.mod_version, '-') && 'false' || 'true' }}
          body: |
            Minecraft 26.3 client mod for Fabric and NeoForge. Requires Java 25 and the matching dependencies listed in the README.

            This version supports Windows with OpenGL. Select Video Settings → Graphics API → Prefer OpenGL and restart Minecraft. Vulkan support is distributed separately as an experimental 2.3.0 beta.

            HUD and screen isolation are supported; in-world elements and name-tag hiding remain unavailable. Use OBS Game Capture and verify the test icon in a saved recording before relying on hiding.

            Both loader JARs are built by this workflow. This publication does not add a Windows OBS recording validation result.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/release/*.jar
            build/release/SHA256SUMS
