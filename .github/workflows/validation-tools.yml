name: Acceptance tool checks (no OBS hardware validation)
on:
  push:
    branches: ['feat/vulkan-26.3']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-tools:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tools/windows-validation -v
      - run: python tools/windows-validation/validate.py --help
